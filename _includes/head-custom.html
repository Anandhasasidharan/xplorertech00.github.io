<!-- Search Console Verification -->
{% if site.search_console.google %}
<meta name="google-site-verification" content="{{ site.search_console.google }}">
{% endif %}
{% if site.search_console.bing %}
<meta name="msvalidate.01" content="{{ site.search_console.bing }}">
{% endif %}

{% if page.url == '/' and site.liquidgl.enabled %}
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/gh/naughtyduk/liquidGL@main/scripts/liquidGL.js" defer></script>
{% endif %}

<!-- JSON-LD Structured Data: WebSite + Person -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "WebSite",
      "name": "{{ site.title }}",
      "url": "{{ site.url }}{{ site.baseurl }}/",
      "description": "{{ site.description | escape }}",
      "author": {
        "@type": "Person",
        "name": "{{ site.author }}",
        "email": "{{ site.social.email }}",
        "url": "{{ site.url }}{{ site.baseurl }}/",
        "sameAs": [
          "https://github.com/{{ site.social.github }}",
          "https://x.com/{{ site.social.twitter }}",
          "https://linkedin.com/{{ site.social.linkedin }}"
        ]
      }
    },
    {
      "@type": "Person",
      "name": "{{ site.author }}",
      "email": "{{ site.social.email }}",
      "url": "{{ site.url }}{{ site.baseurl }}/",
      "sameAs": [
        "https://github.com/{{ site.social.github }}",
        "https://x.com/{{ site.social.twitter }}",
        "https://linkedin.com/{{ site.social.linkedin }}"
      ]
    }
  ]
}
</script>
